<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - White Water Rafting</title>
  <meta name="description" content="Contact White Water Rafting Company for inquiries, reservations, suggestions. Find our address, phone, email, map location and contact form.">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section class="company-info">
      <h2>White Water Rafting Company</h2>
      <p>123 Main River Street</p>
      <p>Kolob, California</p>
      <p>+1 999 999 9999</p>
      <p>info@whitewater.com</p>
    </section>

    <div class="contact-grid">
      <div class="map">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12345.6789012345!2d-111.651990!3d40.251990!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1234567890"
          width="400" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <fieldset>
          <legend>Message Purpose</legend>
          <label><input type="radio" name="purpose" value="general" id="general" required> General Inquiry</label>
          <label><input type="radio" name="purpose" value="reservation" id="reservation"> Reservation Question</label>
          <label><input type="radio" name="purpose" value="suggestion" id="suggestion"> Website Suggestion</label>
        </fieldset>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Type here..."></textarea>

        <label><input type="checkbox" name="subscribe" id="subscribe"> Please Subscribe me to the monthly newsletter</label>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <p>©2026 White Water Rafting | Saini Pakanati</p>
    <div class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
      <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
    </div>
  </footer>
</body>
</html>
