<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WDD 130 | Quiz Form</title>
<link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
<header>
  <h1>WDD 130 | Saini Pakanati | HTML & CSS Quiz</h1>
</header>
<main>
  <form>
    <fieldset>
      <legend>Basic HTML and CSS Quiz</legend>
      
      <label for="q1">1. What does the acronym CSS stand for?</label>
      <input type="text" id="q1" name="q1">

      <label for="q2">2. How are id and class attributes selected in CSS?</label>
      <textarea id="q2" name="q2"></textarea>

      <label for="q3">3. Which of the following is a valid CSS comment?</label>
      <select id="q3" name="q3">
        <option value="" selected disabled>Choose One ...</option>
        <option value="option1">/* This is a comment */</option>
        <option value="option2">// This is a comment</option>
        <option value="option3">&lt;!-- This is a comment --&gt;</option>
      </select>

      <label for="q4">4. What is the bottom margin given this declaration?</label>
      <div class="code">margin: 10px 5px 15px;</div>
      <input type="number" id="q4" name="q4">

      <button type="submit">Submit Quiz</button>
    </fieldset>
  </form>
</main>
</body>
</html>
